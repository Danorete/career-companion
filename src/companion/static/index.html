<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F5F5F7">
  <title>Link — Connection Studio</title>
  <link rel="icon" href="/static/link-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/studio.css">
</head>
<body class="connection-studio">
  <a class="skip" href="#main">Skip to main content</a>
  <div class="shell">
    <nav id="side" class="side" aria-label="Sections">
      <div id="side-main" class="contents"></div>
      <div id="side-setup" class="contents"></div>
      <div id="side-status" class="contents"></div>
    </nav>
    <main id="main" class="sheet" tabindex="-1"></main>
    <div id="resize" class="resize" role="separator" aria-orientation="vertical" aria-label="Resize companion panel" tabindex="0"></div>
    <aside id="dock" class="dock" aria-label="Link, your companion">
      <header class="dock-head">
        <span id="orb" class="orb is-ready"></span>
        <div class="dock-id">
          <div class="dock-name">Link</div>
          <div id="dock-status" class="dock-status" role="status">Ready</div>
        </div>
        <button id="dock-collapse" type="button" class="icon-btn" aria-label="Collapse companion panel"></button>
      </header>
      <section id="studio-context" class="studio-context" aria-label="Current workspace guidance"></section>
      <div id="chat-log" class="chat-log" role="log" aria-live="polite" aria-label="Conversation with Link"></div>
      <div id="chat-attach" class="chat-attach"></div>
      <form id="chat-form" class="composer">
        <label class="sr" for="chat-input">Message Link</label>
        <textarea id="chat-input" autocomplete="off" rows="1" maxlength="4000" placeholder="Talk it through…"></textarea>
        <button id="chat-send" type="submit" class="send" aria-label="Send message"></button>
      </form>
    </aside>
  </div>
  <nav id="mobile-tabs" class="mobile-tabs" aria-label="Main navigation"></nav>
  <nav id="mobile-more" class="mobile-more hidden" aria-label="More sections"></nav>
  <button id="dock-pill" type="button" class="dock-pill"></button>
  <div id="toast" class="toast hidden" role="status"></div>
  <script src="/static/connection-workflows.js"></script>
  <script src="/static/network-sources.js"></script>
  <script src="/static/app.js"></script>
  <script src="/static/link-guide.js"></script>
</body>
</html>
